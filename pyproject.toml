[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gapleak-open"
version = "0.1.0"
description = "Curated open-source subset of the GapLeak scenario websites, synthetic data, and metrics."
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]
